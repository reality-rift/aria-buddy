<body>

         slides in above the pet when it's tapped. -->

        <div id="onboarding" class="hidden"></div>
        <div id="panel" class="hidden"></div>
        <div id="bubble" class="hidden"></div>
        <div id="effects"></div>
        <canvas id="pet" width="192" height="208" title="Aria Buddy"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
