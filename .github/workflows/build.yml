# Builds Aria Buddy installers for macOS (dmg, Intel + Apple Silicon) and
# Windows (nsis .exe) on every tag push (v*), attaching them to a GitHub
# release. Manual runs via workflow_dispatch build without releasing.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # tauri-action creates the GitHub release + uploads assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: builds UNSIGNED for now. macOS users right-click -> Open on
          # first launch. To sign + notarize later, add these repo secrets and
          # tauri-action picks them up automatically:
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          #   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Aria Buddy ${{ github.ref_name }}"
          releaseBody: "HelloAria desktop pet — download the installer for your OS."
          releaseDraft: true
          args: ${{ matrix.args }}
